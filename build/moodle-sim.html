<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodle simulator</title>
<style>
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: #f4f8fc; color: #1d2125; }
  body.dark { background: #0f1220; color: #d9d4e0; }
  body.dark .bar, body.dark .page { background: #171b2c; border-color: #2a3050; }
  .bar { background: #fff; border-bottom: 1px solid #dee2e6; padding: 10px 20px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .bar strong { color: #0f6cbf; }
  input { font: inherit; padding: 5px 8px; border: 1px solid #ced4da; border-radius: 4px; }
  #url { flex: 1; min-width: 280px; }
  button { font: inherit; padding: 5px 12px; border-radius: 4px; border: 1px solid #0f6cbf; background: #0f6cbf; color: #fff; cursor: pointer; }
  .page { max-width: 1000px; margin: 20px auto; background: transparent; border: 1px solid #dee2e6; border-radius: 6px; padding: 20px; }
  h2 { margin: 0 0 12px; font-size: 22px; }
  #log { font: 13px/1.5 ui-monospace, Consolas, monospace; background: #1d2125; color: #c8e6c9; padding: 10px 14px; border-radius: 6px; max-height: 160px; overflow: auto; white-space: pre-wrap; }
  #toast { position: fixed; top: 70px; right: 20px; background: #dff0d8; color: #3c763d; padding: 12px 18px; border: 1px solid #d6e9c6; border-radius: 4px; display: none; font-weight: bold; }
  iframe { width: 100%; height: 800px; border: none; }
</style>
</head>
<body>
<!-- Mimics mod_embedcourse/view.php (and mod_extpagewithgrades): same iframe, same postMessage handlers. -->
<div class="bar">
  <strong>Moodle simulator</strong>
  <label>uid <input id="uid" value="42" size="4"></label>
  <label>cid <input id="cid" value="7" size="4"></label>
  <label title="Plugin variable Full name, passed as name= (badge pages only)">name <input id="name" value="" size="12" placeholder="(not passed)"></label>
  <label>Moodle theme <select id="theme"><option value="auto">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  <label title="Embedded Course Page setting: Sync light/dark mode"><input type="checkbox" id="sync" checked> theme sync</label>
  <input id="url" placeholder="/getting-started/what-is-codex/">
  <button id="go">Open</button>
</div>
<div class="page">
  <h2 id="title">External page with grades</h2>
  <div id="log">Waiting for messages from the page…</div>
  <!-- referrerpolicy mirrors the real Moodle, which sends no referrer to the course page --><iframe id="extpage-iframe" allowfullscreen referrerpolicy="no-referrer"></iframe>
</div>
<div id="toast"></div>
<script>
  const qs = new URLSearchParams(location.search);
  const $ = (id) => document.getElementById(id);
  $("url").value = qs.get("url") || "/";
  if (qs.get("uid")) $("uid").value = qs.get("uid");
  if (qs.get("cid")) $("cid").value = qs.get("cid");
  if (qs.get("name")) $("name").value = qs.get("name");
  window.__messages = [];
  function log(line) { const l = $("log"); l.textContent = (l.textContent.startsWith("Waiting") ? "" : l.textContent + "\n") + line; l.scrollTop = 1e9; }
  function open() {
    const u = new URL($("url").value, location.origin);
    u.searchParams.set("uid", $("uid").value);
    u.searchParams.set("cid", $("cid").value);
    if ($("name").value) u.searchParams.set("name", $("name").value);
    $("extpage-iframe").src = u.pathname + u.search;
    history.replaceState(null, "", `?url=${encodeURIComponent($("url").value)}&uid=${$("uid").value}&cid=${$("cid").value}${$("name").value ? "&name=" + encodeURIComponent($("name").value) : ""}`);
  }
  $("go").onclick = open;
  // Mirrors mod_embedcourse ("Sync light/dark mode"): forward the colour mode to the iframe.
  const mq = matchMedia("(prefers-color-scheme: dark)");
  function resolved() { const m = $("theme").value; return m === "auto" ? (mq.matches ? "dark" : "light") : m; }
  function sendTheme() {
    document.body.classList.toggle("dark", resolved() === "dark");
    if ($("sync").checked) $("extpage-iframe").contentWindow?.postMessage({ type: "moodleTheme", theme: resolved() }, "*");
  }
  $("theme").onchange = sendTheme; $("sync").onchange = sendTheme; mq.addEventListener("change", sendTheme);
  $("extpage-iframe").addEventListener("load", sendTheme);
  window.__setMoodleTheme = (m) => { $("theme").value = m; sendTheme(); };
  window.addEventListener("message", (event) => {
    // mod_embedcourse accepts messages only from this activity's iframe.
    if (event.source !== $("extpage-iframe").contentWindow) return;
    const d = event.data || {};
    window.__messages.push(d);
    if (d.type === "moodleIframeResize") {
      $("extpage-iframe").style.height = d.height + "px";
    }
    if (d.type === "moodleSubmitGrade") {
      log(`moodleSubmitGrade  score=${d.score}  maxScore=${d.maxScore}  → ${Math.round((d.score / d.maxScore) * 100)}%`);
      $("toast").textContent = `Grade Saved: ${d.score}/${d.maxScore}`;
      $("toast").style.display = "block";
      setTimeout(() => ($("toast").style.display = "none"), 3000);
    }
  });
  open();
</script>
</body>
</html>
