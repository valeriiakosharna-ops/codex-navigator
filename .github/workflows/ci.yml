# Runs on every pull request: validates content, builds, and runs browser tests.
# A red check here means "do not merge" — the log lists the exact file and line.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # Official image with Chromium and system deps preinstalled (version must match @playwright/test).
    container: mcr.microsoft.com/playwright:v1.65.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate & build content
        run: npm run build
      - name: Browser tests
        run: npx playwright test
        env:
          HOME: /root
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-preview
          path: dist/
          retention-days: 7
