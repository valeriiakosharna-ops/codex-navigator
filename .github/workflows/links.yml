# Weekly check that the official links still work. Official sites move pages around —
# this catches it before learners do. Opens an issue on failure.
name: Link check
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        id: lychee
        with:
          args: --no-progress --accept 200,206,403,429 --max-retries 3 "content/**/*.md" "widgets/**/*.mjs"
          fail: false
      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links in course content
          content-filepath: ./lychee/out.md
          labels: content, links
