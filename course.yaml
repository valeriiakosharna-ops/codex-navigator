# Course settings. Authors rarely touch this file.
id: codex-navigator            # never change after launch: progress & pins are keyed by it
title: Codex Navigator
tagline: A guided path through OpenAI's official Codex training, with use cases, practice labs and badge checkpoints for every role.
description: Navigator course for OpenAI Codex that links to official OpenAI training and adds practical guidance.
language: en
gradeMode: on-complete         # on-complete: send the page score when all graded activities are done
moodleOrigins: []              # e.g. ["https://moodle.example.com"] to only report grades to your Moodle
footer: >-
  This course is a navigator: it links to official OpenAI materials and adds NIX recommendations.
  Codex and OpenAI are trademarks of OpenAI; official content belongs to its owners.
intro: |
  **How this navigator works.** The course follows OpenAI's official Codex training: the
  OpenAI Academy learning paths, the Codex docs, OpenAI's videos and the Cookbook. Each page tells
  you *why* a resource matters and *what to watch for*, adds use cases from real teams, and ends
  with a quiz or a lab. Typical rhythm: read the brief → open the official material → come back
  for the practice.

  **Find your topics.** Every page says who it's for: **everyone**, **technical specialists** or
  **non-technical specialists**. Skip what isn't yours.

  **Badges.** Modules end with a 🏅 checkpoint. Finish the OpenAI Academy course, pass its
  assessment (80% or more), and paste the badge link from Accredible's email. The page checks it and
  records your grade automatically. Academy is free; cards that need an account show a 🔑 badge.
