intro: |
  **How this navigator works.** Each page sends you to an official OpenAI resource and tells you
  *why* it matters, *what to watch for* while studying it, and how teams actually use it.
  Then you check yourself. Typical rhythm per page: read the brief → open the official material →
  come back for the use cases and the quiz.

  Most materials are public. The OpenAI Academy bootcamp recordings need a free Academy account,
  and each card says so with a 🔑 badge.
